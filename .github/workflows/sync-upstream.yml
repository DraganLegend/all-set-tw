name: Check Upstream Updates

on:
  schedule:
    # GitHub Actions uses UTC; runs daily at 04:15 Taiwan time.
    - cron: "15 20 * * *"
  workflow_dispatch:

# This workflow is intentionally read-only. Upstream changes must be reviewed
# and merged through the integration branch before they can reach main.
permissions:
  contents: read

concurrency:
  group: check-upstream
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration
          fetch-depth: 0
          persist-credentials: false

      - name: Compare integration with upstream
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/TedLin1993/all-set-tw.git
          git fetch --no-tags upstream main

          local_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse upstream/main)"
          read -r ahead behind <<< "$(git rev-list --left-right --count HEAD...upstream/main)"

          {
            echo "## Upstream review"
            echo
            echo '- Local branch: `integration`'
            printf -- '- Local commit: `%s`\n' "$local_sha"
            printf -- '- Upstream commit: `%s`\n' "$upstream_sha"
            printf -- '- Local-only commits: `%s`\n' "$ahead"
            printf -- '- Upstream-only commits: `%s`\n' "$behind"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$behind" -eq 0 ]; then
            echo "No upstream updates are waiting for review." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Upstream commits waiting for review"
            echo
            echo '~~~text'
            git log -n 50 --oneline --no-decorate HEAD..upstream/main
            echo '~~~'
            echo
            echo "### Diff summary"
            echo
            echo '~~~text'
            git diff --stat HEAD...upstream/main | sed -n '1,100p'
            echo '~~~'
            echo
            echo 'No files were changed by this workflow. Review upstream changes manually before merging them into `integration`.'
          } >> "$GITHUB_STEP_SUMMARY"
